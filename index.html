<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 단어 퀴즈</title>
  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .quiz-container {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .header {
      margin-bottom: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.5rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .progress {
      font-size: 0.9rem;
      color: #666;
      font-weight: 600;
    }
    .word-box {
      background: #eef2ff;
      border: 2px solid #c7d2fe;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .word-box h2 {
      font-size: 2rem;
      color: #3730a3;
      letter-spacing: 0.5px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .option-btn {
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #374151;
      font-weight: 500;
    }
    .option-btn:hover:not(:disabled) {
      background: #f9fafb;
      border-color: #d1d5db;
    }
    .option-btn.correct {
      background: #dcfce7 !important;
      border-color: #86efac !important;
      color: #166534 !important;
      font-weight: 700;
    }
    .option-btn.incorrect {
      background: #fee2e2 !important;
      border-color: #fca5a5 !important;
      color: #991b1b !important;
      font-weight: 700;
    }
    .feedback-box {
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.correct {
      background-color: #f0fdf4;
      color: #15803d;
    }
    .feedback-box.incorrect {
      background-color: #fef2f2;
      color: #b91c1c;
    }
    .db-status {
      font-size: 0.8rem;
      text-align: center;
      min-height: 18px;
      margin-top: 8px;
      color: #6b7280;
    }
    .db-status.error {
      color: #dc2626;
    }
    .next-btn, .restart-btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .next-btn:hover, .restart-btn:hover {
      background: #4338ca;
    }
    .result-screen {
      text-align: center;
      padding: 20px 0;
    }
    .result-screen h2 {
      font-size: 1.8rem;
      color: #1f2937;
      margin-bottom: 12px;
    }
    .result-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 24px;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- 퀴즈 화면 -->
    <div id="quiz-screen">
      <div class="header">
        <h1>영어 단어 퀴즈</h1>
        <div class="progress" id="progress-text">문제 1 / 3</div>
      </div>

      <div class="word-box">
        <h2 id="word-display">abundant</h2>
      </div>

      <div class="options-grid" id="options-container">
        <!-- 보기 버튼이 자바스크립트로 생성됩니다 -->
      </div>

      <div id="feedback" class="feedback-box"></div>
      
      <button id="next-btn" class="next-btn hidden">다음 문제</button>
      <div id="db-status" class="db-status"></div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-screen hidden">
      <h2>퀴즈 완료!</h2>
      <p style="color: #6b7280; margin-bottom: 8px;">최종 점수</p>
      <div class="result-score" id="final-score">0 / 3</div>
      <button id="restart-btn" class="restart-btn">다시 풀기</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. Supabase 설정 (사용자 정보 교체 위치)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://efuybthjayvudypybraq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_c-W6PpNUirVyyZ5h_G7YvA__RltfFrT";

    let supabaseClient = null;
    if (SUPABASE_URL !== "https://efuybthjayvudypybraq.supabase.co" && SUPABASE_PUBLISHABLE_KEY !== "sb_publishable_c-W6PpNUirVyyZ5h_G7YvA__RltfFrT") {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }

    // -------------------------------------------------------------
    // 2. 퀴즈 데이터 정의
    // -------------------------------------------------------------
    const QUIZ_DATA = [
      {
        question_no: 1,
        word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        answer: "풍부한"
      },
      {
        question_no: 2,
        word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        answer: "주저하는"
      },
      {
        question_no: 3,
        word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        answer: "짧은"
      }
    ];

    // -------------------------------------------------------------
    // 3. 상태 변수
    // -------------------------------------------------------------
    let currentAttemptId = "";
    let currentQuestionIndex = 0;
    let score = 0;
    let questionStartTime = 0;
    let isAnswered = false;

    // DOM 요소
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const progressText = document.getElementById("progress-text");
    const wordDisplay = document.getElementById("word-display");
    const optionsContainer = document.getElementById("options-container");
    const feedbackBox = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const dbStatus = document.getElementById("db-status");
    const finalScore = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");

    // -------------------------------------------------------------
    // 4. 앱 초기화 및 시작
    // -------------------------------------------------------------
    function startQuiz() {
      currentAttemptId = crypto.randomUUID();
      currentQuestionIndex = 0;
      score = 0;
      
      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");
      
      loadQuestion();
    }

    // -------------------------------------------------------------
    // 5. 문제 불러오기 및 타임스탬프 기록
    // -------------------------------------------------------------
    function loadQuestion() {
      isAnswered = false;
      const q = QUIZ_DATA[currentQuestionIndex];

      progressText.textContent = `문제 ${q.question_no} / ${QUIZ_DATA.length}`;
      wordDisplay.textContent = q.word;
      feedbackBox.className = "feedback-box";
      feedbackBox.textContent = "";
      nextBtn.classList.add("hidden");
      dbStatus.textContent = "";
      dbStatus.className = "db-status";

      optionsContainer.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => handleSelectOption(opt, btn));
        optionsContainer.appendChild(btn);
      });

      // 문제 제시 시간 측정 시작
      questionStartTime = performance.now();
    }

    // -------------------------------------------------------------
    // 6. 답안 선택 처리 및 Supabase 데이터 저장
    // -------------------------------------------------------------
    async function handleSelectOption(selected, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const responseTimeMs = Math.round(performance.now() - questionStartTime);
      const q = QUIZ_DATA[currentQuestionIndex];
      const isCorrect = (selected === q.answer);

      if (isCorrect) score++;

      // 버튼 UI 상태 변경
      const buttons = optionsContainer.querySelectorAll(".option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) {
          btn.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add("incorrect");
      }

      // 피드백 출력
      feedbackBox.textContent = isCorrect ? "정답입니다!" : `오답입니다. (정답: ${q.answer})`;
      feedbackBox.className = `feedback-box show ${isCorrect ? "correct" : "incorrect"}`;

      // 다음/결과 버튼 표시
      if (currentQuestionIndex < QUIZ_DATA.length - 1) {
        nextBtn.textContent = "다음 문제";
      } else {
        nextBtn.textContent = "결과 보기";
      }
      nextBtn.classList.remove("hidden");

      // Supabase 데이터 INSERT (실패 시에도 진행은 지속)
      if (supabaseClient) {
        dbStatus.textContent = "응답 저장 중...";
        
        try {
          const { error } = await supabaseClient
            .from("quiz_answers")
            .insert({
              attempt_id: currentAttemptId,
              question_no: q.question_no,
              english_word: q.word,
              chosen_answer: selected,
              is_correct: isCorrect,
              response_time_ms: responseTimeMs
            });

          if (error) {
            console.error("Supabase insert error:", error);
            dbStatus.textContent = "저장 실패 (퀴즈는 계속 진행됩니다)";
            dbStatus.classList.add("error");
          } else {
            dbStatus.textContent = "저장 완료";
          }
        } catch (err) {
          console.error("Network or client error:", err);
          dbStatus.textContent = "저장 실패 (퀴즈는 계속 진행됩니다)";
          dbStatus.classList.add("error");
        }
      } else {
        dbStatus.textContent = "Supabase 설정 전 (로컬 모드)";
      }
    }

    // -------------------------------------------------------------
    // 7. 이벤트 리스너 설정
    // -------------------------------------------------------------
    nextBtn.addEventListener("click", () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < QUIZ_DATA.length) {
        loadQuestion();
      } else {
        showResults();
      }
    });

    restartBtn.addEventListener("click", () => {
      startQuiz();
    });

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      finalScore.textContent = `${score} / ${QUIZ_DATA.length}`;
    }

    // 앱 실행
    startQuiz();
  </script>
</body>
</html>
