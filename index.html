<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 단어 퀴즈</title>
  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .quiz-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.4rem;
      color: #1a202c;
      margin-bottom: 8px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #3182ce;
      transition: width 0.3s ease;
    }
    .word-box {
      background-color: #edf2f7;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .word-box .word {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2d3748;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      background-color: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
      background-color: #f7fafc;
      border-color: #cbd5e0;
    }
    .option-btn:disabled {
      cursor: default;
    }
    .option-btn.correct {
      background-color: #c6f6d5 !important;
      border-color: #38a169 !important;
      color: #22543d;
      font-weight: 600;
    }
    .option-btn.wrong {
      background-color: #fed7d7 !important;
      border-color: #e53e3e !important;
      color: #742a2a;
    }
    .feedback {
      margin-top: 16px;
      font-size: 0.95rem;
      text-align: center;
      min-height: 24px;
      font-weight: 600;
    }
    .feedback.correct {
      color: #2f855a;
    }
    .feedback.wrong {
      color: #c53030;
    }
    .next-btn, .restart-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .next-btn:hover, .restart-btn:hover {
      background-color: #2b6cb0;
    }
    .result-container {
      text-align: center;
    }
    .result-score {
      font-size: 2rem;
      font-weight: 700;
      color: #2b6cb0;
      margin: 16px 0;
    }
    .db-status {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #718096;
      text-align: center;
    }
    .db-status.error {
      color: #e53e3e;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- 퀴즈 영역 -->
    <div id="quiz-view">
      <div class="header">
        <h1 id="question-number">문제 1 / 3</h1>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="word-box">
        <div class="word" id="word-text">word</div>
      </div>

      <div class="options" id="options-container">
        <!-- 보기 버튼이 JS로 생성됩니다 -->
      </div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">다음 문제</button>
    </div>

    <!-- 결과 영역 -->
    <div id="result-view" class="result-container" style="display: none;">
      <h1>퀴즈 종료!</h1>
      <p style="margin-top: 8px; color: #4a5568;">수고하셨습니다. 최종 점수입니다.</p>
      <div class="result-score" id="final-score">0 / 3 점</div>
      <button class="restart-btn" onclick="startQuiz()">다시 풀기</button>
    </div>

    <div class="db-status" id="db-status"></div>
  </div>

  <script>
    // 1. Supabase 접속 설정
    const SUPABASE_URL = "https://efuybthjayvudypybraq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_c-W6PpNUirVyyZ5h_G7YvA__RltfFrT";

    // Supabase 클라이언트 직접 생성
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 2. 퀴즈 문제 데이터
    const QUIZ_DATA = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        correct_answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        correct_answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        correct_answer: "짧은"
      }
    ];

    // 3. 상태 변수
    let currentAttemptId = "";
    let currentQuestionIndex = 0;
    let score = 0;
    let questionStartTime = 0;
    let isAnswered = false;

    // 4. 퀴즈 시작 및 초기화
    function startQuiz() {
      currentAttemptId = crypto.randomUUID();
      currentQuestionIndex = 0;
      score = 0;
      
      document.getElementById("quiz-view").style.display = "block";
      document.getElementById("result-view").style.display = "none";
      document.getElementById("db-status").textContent = "";

      renderQuestion();
    }

    // 5. 문제 렌더링
    function renderQuestion() {
      isAnswered = false;
      const q = QUIZ_DATA[currentQuestionIndex];

      document.getElementById("question-number").textContent = `문제 ${q.question_no} / ${QUIZ_DATA.length}`;
      document.getElementById("word-text").textContent = q.english_word;
      document.getElementById("progress-bar").style.width = `${(q.question_no / QUIZ_DATA.length) * 100}%`;
      
      const feedbackEl = document.getElementById("feedback");
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      document.getElementById("next-btn").style.display = "none";

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach((option) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = () => handleAnswerSelect(option, btn);
        optionsContainer.appendChild(btn);
      });

      // 문제 제시 직후 시간 측정 시작
      questionStartTime = performance.now();
    }

    // 6. 답안 선택 처리
    async function handleAnswerSelect(chosenAnswer, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const responseTimeMs = Math.round(performance.now() - questionStartTime);
      const q = QUIZ_DATA[currentQuestionIndex];
      const isCorrect = (chosenAnswer === q.correct_answer);

      if (isCorrect) score++;

      // UI 피드백 표시
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correct_answer) {
          btn.classList.add("correct");
        }
      });

      const feedbackEl = document.getElementById("feedback");
      if (isCorrect) {
        feedbackEl.textContent = "정답입니다! 🎉";
        feedbackEl.classList.add("correct");
      } else {
        selectedBtn.classList.add("wrong");
        feedbackEl.textContent = `오답입니다. (정답: ${q.correct_answer})`;
        feedbackEl.classList.add("wrong");
      }

      // 다음/결과 버튼 표시
      const nextBtn = document.getElementById("next-btn");
      if (currentQuestionIndex < QUIZ_DATA.length - 1) {
        nextBtn.textContent = "다음 문제";
      } else {
        nextBtn.textContent = "결과 보기";
      }
      nextBtn.style.display = "block";

      // Supabase 데이터 저장 (비동기, 실패해도 퀴즈 진행)
      saveAnswerToSupabase({
        attempt_id: currentAttemptId,
        question_no: q.question_no,
        english_word: q.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: responseTimeMs
      });
    }

      try {
        const { error } = await supabaseClient
          .from("quiz_answers
